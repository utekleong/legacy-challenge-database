name: Update database

on:
  schedule:
    - cron: "0 16 * * 0"   # Sunday 16:00 UTC = Monday 00:00 in Singapore (GitHub uses UTC)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index.html from the sheet
        run: python build.py

      - name: Commit and push if the data changed
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes; nothing to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update data from sheet"
            git push
          fi
