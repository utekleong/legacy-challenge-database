<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legacy Challenge Database</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3f5;--sf:#fff;--ink:#15181e;--mute:#667085;--line:#e1e4ea;--ac:#2d56e0;--acs:#e8edfd;--win:#1b8a57;--loss:#c4403f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--sf:#1b1e26;--ink:#eceef3;--mute:#9aa2b3;--line:#2b303b;--ac:#7c9bff;--acs:#252c47;--win:#47c98a;--loss:#f0706f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--sf:#1b1e26;--ink:#eceef3;--mute:#9aa2b3;--line:#2b303b;--ac:#7c9bff;--acs:#252c47;--win:#47c98a;--loss:#f0706f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{position:relative;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;width:100%;flex:1 0 auto;margin:0 auto;padding:28px 18px 60px;text-align:center}
body.home .wrap{display:flex;flex-direction:column;justify-content:center;padding-bottom:28px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:18px 18px 24px}
footer a{color:inherit;text-decoration:underline}
h1{font-size:clamp(32px,6.5vw,56px);line-height:1.1;margin:8px 0 14px;letter-spacing:-.025em;text-align:center}
.sub{color:var(--mute);margin:0 0 22px}
.search{position:relative;max-width:100%;margin:0 auto}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink)}
input:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sf);border:1px solid var(--line);border-radius:10px;z-index:5;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sug button{display:flex;justify-content:space-between;width:100%;padding:10px 16px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.sug{text-align:left}
.sug button:hover,.sug button.on{background:var(--acs)}
.sug span{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--sf);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--ac)}
.lbl{color:var(--mute);font-size:14px;margin:22px 0 0}
.who{display:flex;align-items:baseline;justify-content:flex-start;text-align:left;gap:14px;margin:8px 0 22px;flex-wrap:wrap}
.who h2{margin:0;font-size:clamp(32px,6.5vw,56px);line-height:1.1;letter-spacing:-.025em}
#clr{position:absolute;top:16px;right:16px;z-index:6;border:0;border-radius:999px;background:#d13b3b;color:#fff;font:inherit;font-size:16px;font-weight:600;padding:11px 26px;cursor:pointer;box-shadow:0 2px 10px rgba(209,59,59,.35)}
#clr:hover{background:#b92f2f}
#clr:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
body.view h1,body.view p.sub,body.view .search{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.st b{display:block;font-size:24px;line-height:1.2}
.st small{color:var(--mute)}
h3{font-size:16px;margin:28px 0 10px}
.box{text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:6px 16px}
.dk{display:grid;grid-template-columns:minmax(130px,1.3fr) 2fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.dk:last-child{border:0}
.bar{height:8px;background:var(--loss);border-radius:4px;overflow:hidden;opacity:.9}
.bar i{display:block;height:100%;background:var(--win)}
.dk em{font-style:normal;color:var(--mute);font-size:13px;text-align:right;white-space:nowrap}
.tw{text-align:left;overflow-x:auto;background:var(--sf);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:13px}
tr:last-child td{border:0}
.n{text-align:right}
.srt{display:inline-flex;flex-direction:column;vertical-align:middle;margin-left:4px;line-height:1}
.sa{border:0;background:none;color:var(--mute);opacity:.45;font-size:8px;line-height:1;padding:1px 3px;cursor:pointer}
.sa:hover{opacity:1}
.sa.on{color:var(--ac);opacity:1}
.dk[data-p],.dk[data-k]{cursor:pointer}
.dk[data-p]:hover,.dk[data-k]:hover{background:var(--acs)}
@media (max-width:700px){.wrap{padding-top:68px}}
.bgl{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;opacity:0;pointer-events:none;transition:opacity 1.5s ease}
body.home .bgl.on{opacity:.2}
@media (prefers-color-scheme:dark){body.home .bgl.on{opacity:.14}}
@media (prefers-reduced-motion:reduce){.bgl{transition:none}}
#art{margin-top:4px}
body.view #art{display:none}
.flt{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-start;text-align:left;margin:0 0 4px;color:var(--mute);font-size:14px}
.pre{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pb{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pb:hover{border-color:var(--ac)}
.pb.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.flt label{display:flex;align-items:center;gap:8px}
.flt input{width:auto;font-size:15px;padding:8px 10px}
#dr{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
#dr:hover{border-color:var(--ac)}
.navb{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px auto 0;max-width:100%}
.nb{flex:0 0 auto;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.nb:hover{border-color:var(--ac);background:var(--acs)}
body.view .navb{display:none}
.lk{cursor:pointer}
.lk:hover td{background:var(--acs)}
.empty{color:var(--mute);padding:40px 0;text-align:center}
/* spacing pass */
.menu{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;z-index:9}
.mnb{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:50%;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.mnb:hover,.mnb[aria-expanded="true"]{border-color:var(--ac);background:var(--acs)}
.mnb:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
body.view .menu{display:none}

.nb .car{font-size:11px;margin-left:4px}
.mlist{position:absolute;top:calc(100% + 8px);left:0;min-width:240px;background:var(--sf);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:8px;text-align:left;z-index:8}
.mh{color:var(--mute);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px 4px}
.mh.sep{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.mi{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;border-radius:8px;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--acs);outline:none}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 0 30px;text-align:left}
.cmp label{display:flex;flex-direction:column;gap:8px;color:var(--mute);font-size:14px}
.cmp input{font-size:16px;padding:12px 14px}
.cmpt td.bt{color:var(--win);font-weight:700}
.cmpt{min-width:0}
.dkn{font-weight:700;color:var(--ink);cursor:pointer;white-space:normal}
.dkn:hover{color:var(--ac)}
@media (max-width:700px){.cmp{grid-template-columns:1fr}}
.wrap{padding:44px 28px 88px}
h1{margin:10px 0 18px}
.sub{margin:0 0 34px;line-height:1.7}
.navb{gap:12px;margin:22px auto 0}
.nb{padding:9px 18px;font-size:14px;border-radius:10px}
.who{margin:12px 0 30px;gap:18px}
.flt{gap:16px;margin:0 0 14px}
.flt input{padding:9px 12px}
#dr{padding:8px 16px}
.pre{gap:10px;margin:0 0 30px}
.pb{padding:7px 16px;border-radius:10px}
.stats{gap:18px}
.st{padding:20px 22px}
.st small{display:block;margin-top:4px}
h3{margin:42px 0 16px}
.box{padding:10px 24px}
.dk{padding:15px 0;gap:18px}
th,td{padding:14px 18px}
th{padding-top:16px;padding-bottom:16px}
.srt{margin-left:8px}
.sa{padding:2px 4px}
.lbl{margin:28px 0 0}
.empty{padding:56px 0}
footer{padding:28px 24px 32px;line-height:1.8}
.stats{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.st{display:flex;flex-direction:column;justify-content:center;min-height:96px}
.st b{font-size:22px}
h3{text-align:left}
.dk{grid-template-columns:minmax(130px,1.3fr) 2fr 230px}
@media (max-width:700px){.dk{grid-template-columns:1fr 1fr;row-gap:6px}.dk .bar{grid-column:1/-1;order:3}}
th:first-child,td:first-child{width:1%;text-align:left;padding-left:22px;color:var(--mute)}
@media (max-width:700px){.wrap{padding:76px 18px 64px}th,td{padding:12px 14px}.st{padding:16px 18px}}

.mnb{width:auto;height:46px;gap:10px;padding:0 20px 0 16px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:inherit;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:mpulse 1.8s ease-out 3}
.mnb:hover,.mnb[aria-expanded="true"]{background:var(--ink);filter:opacity(.85);border:0}
@keyframes mpulse{0%{box-shadow:0 4px 14px rgba(0,0,0,.18),0 0 0 0 rgba(120,126,140,.4)}70%,100%{box-shadow:0 4px 14px rgba(0,0,0,.18),0 0 0 14px rgba(120,126,140,0)}}
@media (prefers-reduced-motion:reduce){.mnb{animation:none}}
</style></head><body>
<div id="bg" class="bgl" aria-hidden="true"></div>
<div id="bg2" class="bgl" aria-hidden="true"></div>
<div class="wrap">
<h1><span id="tt">Legacy Challenge Database</span></h1>
<p class="sub"><span id="meta"></span></p>
<div class="search">
<input id="q" type="search" placeholder="Search for a player or deck…" autocomplete="off" aria-label="Search for a player or deck">
<div class="sug" id="sug" hidden></div>
</div>
<div class="menu"><button id="mn" class="mnb" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span>Menu</span></button><div class="mlist" id="ml" hidden>
<div class="mh">Leaderboards</div>
<button id="bp" class="mi" type="button">Most active players</button>
<button id="bd" class="mi" type="button">Most played decks</button>
<button id="bt" class="mi" type="button">Most Top 8s</button>
<div class="mh sep">Tools</div>
<button id="bc" class="mi" type="button">Compare decks</button>
</div></div><div id="out"></div>
</div>
<footer>Data from the <a href="https://patreon.com/legacydatacollection" target="_blank" rel="noopener">Legacy Data Collection Project</a><div id="art"></div></footer>
<script type="application/json" id="d">__DATA__</script>
<script>
var D=JSON.parse(document.getElementById('d').textContent),P=D.p,A=D.a,K=D.k,E=D.e,T=D.d,R=D.r;
var by,low,order,byk,lowk,korder,dmin,dmax;
var $=function(i){return document.getElementById(i)},q=$('q'),sug=$('sug'),out=$('out');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pct(w,l){return w+l?(100*w/(w+l)).toFixed(1)+'%':'—'}
function fd(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?m[3]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+m[1]:d}
function meta(){$('meta').innerHTML=esc(P.length.toLocaleString()+' players · '+R.length.toLocaleString()+' results · '+E.length+' events')+'<br>'+esc(fd(dmin)+' to '+fd(dmax))}
function prep(){var sd=T.slice().sort();dmin=sd[0];dmax=sd[sd.length-1];by=P.map(function(){return[]});R.forEach(function(r,i){by[r[0]].push(i)});low=P.map(function(s){return s.toLowerCase()});order=P.map(function(_,i){return i}).sort(function(a,b){return by[b].length-by[a].length});byk=K.map(function(){return[]});R.forEach(function(r,i){byk[r[5]].push(i)});lowk=K.map(function(s){return s.toLowerCase()});korder=K.map(function(_,i){return i}).sort(function(a,b){return byk[b].length-byk[a].length});meta()}
function home(){
 document.body.classList.add('home');document.body.classList.remove('view');
 out.innerHTML='';fit();
}
var rf='',rt='';
var noRes='<div class="empty">No results in this date range.</div>';
function inRange(r){var d=T[r[8]];return(!rf||d>=rf)&&(!rt||d<=rt)}
function sortRows(rs){return rs.sort(function(a,b){var x=T[a[8]],y=T[b[8]];return x<y?1:x>y?-1:a[1]-b[1]})}
function tally(rs){var o={w:0,l:0,nw:0,nl:0,top8:0,best:1e9};rs.forEach(function(r){o.w+=r[2];o.l+=r[3];o.nw+=r[6];o.nl+=r[7];if(r[1]<=8)o.top8++;if(r[1]<o.best)o.best=r[1]});return o}
function cards(items){return'<div class="stats">'+items.map(function(s){return'<div class="st"><b>'+esc(s[0])+'</b><small>'+s[1]+'</small></div>'}).join('')+'</div>'}
function recRow(label,attr,d){var t=d.w+d.l;return'<div class="dk" '+attr+'><span>'+esc(label)+'</span><div class="bar" title="'+pct(d.w,d.l)+' win rate"><i style="width:'+(t?100*d.w/t:0)+'%"></i></div><em>'+d.n+' event'+(d.n>1?'s':'')+' · '+d.w+'–'+d.l+' · '+pct(d.w,d.l)+'</em></div>'}
var PR=['1M','3M','6M','1Y','2026','2025'];
function pr(k){var y=+dmax.slice(0,4),m=+dmax.slice(5,7)-1,d=+dmax.slice(8,10),n={'1M':1,'3M':3,'6M':6,'1Y':12}[k];
 if(!n)return[k+'-01-01',k+'-12-31'];
 var tm=m-n,ty=y+Math.floor(tm/12);tm=((tm%12)+12)%12;var dim=new Date(Date.UTC(ty,tm+1,0)).getUTCDate();
 var z=function(x){return(x<10?'0':'')+x};
 return[ty+'-'+z(tm+1)+'-'+z(Math.min(d,dim)),dmax]}
function presets(){return'<div class="pre">'+PR.map(function(k){var r=pr(k);return'<button type="button" class="pb'+(rf===r[0]&&rt===r[1]?' on':'')+'" data-pr="'+k+'">'+k+'</button>'}).join('')+'</div>'}
function filterBar(){return'<div class="flt"><label>From <input type="date" id="df" min="'+dmin+'" max="'+dmax+'" value="'+rf+'"></label><label>To <input type="date" id="dt" min="'+dmin+'" max="'+dmax+'" value="'+rt+'"></label><button id="dr" type="button">Reset</button></div>'+presets()}
function wire(fn){
 $('clr').onclick=function(){rf=rt='';q.value='';home();q.focus()};
 var df=$('df'),dt=$('dt');
 function upd(){rf=df.value;rt=dt.value;if(rf&&rt&&rf>rt){var x=rf;rf=rt;rt=x;df.value=rf;dt.value=rt}$('res').innerHTML=fn()}
 function mark(){Array.prototype.forEach.call(document.querySelectorAll('.pb'),function(b){var r=pr(b.dataset.pr);b.classList.toggle('on',rf===r[0]&&rt===r[1])})}
 Array.prototype.forEach.call(document.querySelectorAll('.pb'),function(b){b.onclick=function(){var r=pr(b.dataset.pr);rf=r[0];rt=r[1];df.value=rf;dt.value=rt;$('res').innerHTML=fn();mark()}});
 df.onchange=function(){upd();mark()};dt.onchange=function(){upd();mark()};
 $('dr').onclick=function(){rf=rt='';df.value='';dt.value='';$('res').innerHTML=fn();mark()};
}
function deckBody(ki){
 var rs=sortRows(byk[ki].map(function(i){return R[i]}).filter(inRange));
 if(!rs.length)return noRes;
 var o=tally(rs),pl={};
 rs.forEach(function(r){var d=pl[r[0]]||(pl[r[0]]={n:0,w:0,l:0});d.n++;d.w+=r[2];d.l+=r[3]});
 var ps=Object.keys(pl).map(function(k){return[+k,pl[k]]}).sort(function(a,b){return b[1].n-a[1].n||b[1].w-a[1].w});
 return cards([[rs.length,'Entries'],[ps.length,'Players'],[o.w+'–'+o.l,'Match record'],[pct(o.w,o.l),'Win rate'],[o.nw+'–'+o.nl+' ('+pct(o.nw,o.nl)+')','Excluding mirrors'],[o.top8,'Top 8 finishes'],['#'+o.best,'Best finish']])
 +'<h3>Most frequent pilots'+(ps.length>15?' (top 15 of '+ps.length+')':'')+'</h3><div class="box">'+ps.slice(0,15).map(function(x){return recRow(P[x[0]],'data-p="'+x[0]+'"',x[1])}).join('')+'</div>'
 +'<h3>Event history'+(rs.length>300?' (latest 300 of '+rs.length+')':'')+'</h3><div class="tw"><table><thead><tr><th>Date</th><th>Event</th><th class="n">Rank</th><th>Player</th><th class="n">W–L</th><th class="n">Non-mirror</th></tr></thead><tbody>'
 +rs.slice(0,300).map(function(r){return'<tr><td>'+fd(T[r[8]])+'</td><td>'+esc(E[r[9]])+'</td><td class="n">'+r[1]+'</td><td>'+esc(P[r[0]])+'</td><td class="n" style="color:'+(r[2]>=r[3]?'var(--win)':'var(--loss)')+'">'+r[2]+'–'+r[3]+'</td><td class="n">'+r[6]+'–'+r[7]+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function playerBody(pi){
 var rs=sortRows(by[pi].map(function(i){return R[i]}).filter(inRange));
 if(!rs.length)return noRes;
 var o=tally(rs),dk={};
 rs.forEach(function(r){var d=dk[r[5]]||(dk[r[5]]={n:0,w:0,l:0});d.n++;d.w+=r[2];d.l+=r[3]});
 var decks=Object.keys(dk).map(function(k){return[k,dk[k]]}).sort(function(a,b){return b[1].n-a[1].n});
 return cards([[rs.length,'Events'],[o.w+'–'+o.l,'Match record'],[pct(o.w,o.l),'Win rate'],[o.nw+'–'+o.nl+' ('+pct(o.nw,o.nl)+')','Excluding mirrors'],[o.top8,'Top 8 finishes'],['#'+o.best,'Best finish']])
 +'<h3>Decks played</h3><div class="box">'+decks.map(function(x){return recRow(K[x[0]],'data-k="'+x[0]+'"',x[1])}).join('')+'</div>'
 +'<h3>Event history</h3><div class="tw"><table><thead><tr><th>Date</th><th>Event</th><th class="n">Rank</th><th>Deck</th><th>Archetype</th><th class="n">W–L</th><th class="n">Non-mirror</th></tr></thead><tbody>'
 +rs.map(function(r){return'<tr><td>'+fd(T[r[8]])+'</td><td>'+esc(E[r[9]])+'</td><td class="n">'+r[1]+'</td><td>'+esc(K[r[5]])+'</td><td>'+(A[r[4]]?esc(A[r[4]]):'—')+'</td><td class="n" style="color:'+(r[2]>=r[3]?'var(--win)':'var(--loss)')+'">'+r[2]+'–'+r[3]+'</td><td class="n">'+r[6]+'–'+r[7]+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function showDeck(ki){
 document.body.classList.remove('home');document.body.classList.add('view');
 var arch=A[R[byk[ki][0]][4]];
 out.innerHTML='<div class="who" data-view="deck"><h2>'+esc(K[ki])+'</h2>'+(arch?'<span class="sub" style="margin:0">'+esc(arch)+'</span>':'')+'<button id="clr">Back</button></div>'+filterBar()+'<div id="res">'+deckBody(ki)+'</div>';
 q.value=K[ki];sug.hidden=true;wire(function(){return deckBody(ki)});
}
function show(pi){
